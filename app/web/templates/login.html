{% extends "base.html" %}
{% block title %}教师端登录 · 绘本阅读陪伴 AI{% endblock %}
{% block content %}
<div class="login-card card">
  <div class="brand" style="justify-content:center;margin-bottom:8px">
    <div class="brand-mark">📖</div>
  </div>
  <h2>教师端</h2>
  <p class="hint">输入口令即可进入，不需要账号密码。</p>
  <div class="pin-display" id="pin-display">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <p class="small muted" id="pin-count" style="margin:6px 0 10px;min-height:18px">已输入 0 位</p>
  <div class="keypad" id="keypad">
    <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
    <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
    <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
    <button data-key="clear">清空</button><button data-key="0">0</button><button data-key="back">←</button>
    <button class="wide" data-key="ok" style="background:var(--primary);color:#fff;border:none">进入</button>
  </div>
  <p class="small muted" style="margin-top:14px">口令在 <span class="mono">.env</span> 的 TEACHER_PIN（6 位）/ ADMIN_PIN（8 位）中配置，可以直接粘贴。</p>
</div>
{% endblock %}
{% block scripts %}
<script>
  let pin = '';
  let submitting = false;
  const dots = document.querySelectorAll('.pin-dot');
  const count = document.getElementById('pin-count');

  function paint() {
    dots.forEach((dot, index) => dot.classList.toggle('on', index < pin.length));
    // 圆点不够用时也要让人看到到底输了几位（口令 6 位或 8 位）
    count.textContent = pin.length ? `已输入 ${pin.length} 位` : '已输入 0 位';
  }

  async function submit() {
    if (!pin || submitting) return;
    submitting = true;
    const tried = pin.length;
    try {
      await api('/api/login', {method: 'POST', body: JSON.stringify({pin})});
      // 先确认浏览器真的把登录 Cookie 存下来了，否则跳过去又被踢回登录页
      await api('/api/me');
      location.href = '/teacher';
    } catch (error) {
      const message = error.message && error.message.includes('口令不对')
        ? `口令不对（已输入 ${tried} 位）。核对 .env 里的 TEACHER_PIN / ADMIN_PIN`
        : error.message;
      toast(message);
      pin = '';
      paint();
    } finally {
      submitting = false;
    }
  }

  // 支持直接粘贴口令（从 .env 复制过来的），只取数字；上限放到 12 位，防止有人把口令改长了登不进来
  document.addEventListener('paste', (event) => {
    const text = (event.clipboardData || window.clipboardData).getData('text') || '';
    const digits = text.replace(/\D/g, '').slice(0, 12);
    if (!digits) return;
    event.preventDefault();
    pin = digits;
    paint();
  });

  document.getElementById('keypad').addEventListener('click', (event) => {
    const key = event.target.dataset.key;
    if (!key) return;
    if (key === 'clear') pin = '';
    else if (key === 'back') pin = pin.slice(0, -1);
    else if (key === 'ok') { submit(); return; }
    else if (pin.length < 12) pin += key;
    paint();
  });

  document.addEventListener('keydown', (event) => {
    if (/^[0-9]$/.test(event.key) && pin.length < 12) { pin += event.key; paint(); }
    else if (event.key === 'Backspace') { pin = pin.slice(0, -1); paint(); }
    else if (event.key === 'Enter') submit();
  });
</script>
{% endblock %}
